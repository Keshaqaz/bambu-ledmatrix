[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
; Match the Arduino IDE recommendation: Huge APP (3MB No OTA / 1MB SPIFFS).
; Without this, PlatformIO uses the default OTA layout (~1.25MB app slots),
; which is too tight for the embedded web UI + Bambu integration.
; Keep this project-local CSV so the layout is reproducible across PlatformIO installs.
board_build.partitions = partitions_huge_app.csv
lib_deps =
  fastled/FastLED@^3.10.3
  bblanchon/ArduinoJson@^7.4.3
