[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
; OTA layout: Minimal SPIFFS — two 1.875MB app slots (min_spiffs.csv ships with
; the framework). The stock "default" OTA layout (~1.25MB slots) is too tight
; for the embedded web UI + Bambu integration — do not switch back to it.
board_build.partitions = min_spiffs.csv
lib_deps =
  fastled/FastLED@^3.10.3
  bblanchon/ArduinoJson@^7.4.3
